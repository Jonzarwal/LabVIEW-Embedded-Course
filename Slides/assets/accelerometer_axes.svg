<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Accelerometer axes and gravity at rest</title>
  <desc id="desc">Three orthogonal sensor axes x, y and z, with a gravity vector projected across them. At rest, the measured acceleration vector has a magnitude close to one g.</desc>
  <rect width="1200" height="560" rx="22" fill="#F3F7F6"/>
  <text x="70" y="70" fill="#1D3557" font-family="Arial, sans-serif" font-size="34" font-weight="700">At rest, the sensor measures gravity</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M405 390h360" stroke="#E76F51" stroke-width="9"/>
    <path d="M730 365l35 25-35 25" stroke="#E76F51" stroke-width="9"/>
    <path d="M405 390l-190-155" stroke="#457B9D" stroke-width="9"/>
    <path d="M238 242l-23-7 7 24" stroke="#457B9D" stroke-width="9"/>
    <path d="M405 390V115" stroke="#2A9D8F" stroke-width="9"/>
    <path d="M380 142l25-27 25 27" stroke="#2A9D8F" stroke-width="9"/>
    <path d="M405 390L545 160" stroke="#1D3557" stroke-width="11"/>
    <path d="M534 194l11-34-34 9" stroke="#1D3557" stroke-width="10"/>
  </g>
  <circle cx="405" cy="390" r="18" fill="#1D3557"/>
  <g font-family="Arial, sans-serif" font-size="27" font-weight="700">
    <text x="785" y="400" fill="#E76F51">x</text>
    <text x="180" y="220" fill="#457B9D">y</text>
    <text x="390" y="100" fill="#2A9D8F">z</text>
    <text x="565" y="170" fill="#1D3557">gravity vector</text>
  </g>
  <rect x="700" y="250" width="420" height="155" rx="16" fill="#FFFFFF" stroke="#D7E2DF" stroke-width="3"/>
  <text x="745" y="305" fill="#1D3557" font-family="Arial, sans-serif" font-size="25" font-weight="700">Three-axis output</text>
  <text x="745" y="350" fill="#354B55" font-family="Arial, sans-serif" font-size="22">x, y, z are projections in g.</text>
  <text x="745" y="383" fill="#354B55" font-family="Arial, sans-serif" font-size="22">Near 1 g total when stationary.</text>
</svg>