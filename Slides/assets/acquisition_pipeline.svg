<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Acquisition module loop and queue architecture</title>
  <desc id="desc">A command handler forwards start and stop controls to a dedicated queue. A timed loop samples every 50 milliseconds, batches ten samples, and sends each batch to Main through its manager queue. Shutdown waits for the helper loop to finish.</desc>
  <rect width="1600" height="500" rx="22" fill="#F3F7F6"/>
  <text x="70" y="65" fill="#1D3557" font-family="Arial, sans-serif" font-size="34" font-weight="700">Acquisition v2: separate control from timed sampling</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="65" y="150" width="300" height="175" rx="16" fill="#FFFFFF" stroke="#457B9D" stroke-width="4"/>
    <text x="215" y="198" fill="#1D3557" font-size="27" font-weight="700">Main</text>
    <text x="215" y="239" fill="#354B55" font-size="21">manager queue</text>
    <text x="215" y="276" fill="#354B55" font-size="19">commands + data batches</text>

    <rect x="475" y="150" width="340" height="175" rx="16" fill="#FFFFFF" stroke="#457B9D" stroke-width="4"/>
    <text x="645" y="198" fill="#1D3557" font-size="27" font-weight="700">Acquisition handler</text>
    <text x="645" y="239" fill="#354B55" font-size="21">Start / Stop / shutdown</text>
    <text x="645" y="276" fill="#354B55" font-size="19">waits for helper completion</text>

    <rect x="925" y="150" width="260" height="175" rx="16" fill="#FFFFFF" stroke="#E9C46A" stroke-width="4"/>
    <text x="1055" y="198" fill="#1D3557" font-size="27" font-weight="700">Control queue</text>
    <text x="1055" y="239" fill="#354B55" font-size="21">Start / Stop</text>
    <text x="1055" y="276" fill="#354B55" font-size="19">non-blocking read</text>

    <rect x="1290" y="150" width="250" height="175" rx="16" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="4"/>
    <text x="1415" y="198" fill="#1D3557" font-size="27" font-weight="700">Timed Loop</text>
    <text x="1415" y="239" fill="#354B55" font-size="21">sample every 50 ms</text>
    <text x="1415" y="276" fill="#354B55" font-size="19">buffer 10 samples</text>
  </g>
  <g fill="none" stroke="#457B9D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M365 205h90m-18-18 18 18-18 18"/>
    <path d="M815 205h90m-18-18 18 18-18 18"/>
    <path d="M1185 205h85m-18-18 18 18-18 18"/>
    <path d="M1290 285h-380m18-18-18 18 18 18" stroke="#2A9D8F"/>
  </g>
  <text x="1085" y="365" fill="#2A9D8F" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">10 samples = 1 batch</text>
  <path d="M1415 325v58H215v-50" fill="none" stroke="#E76F51" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M197 350l18-18 18 18" fill="none" stroke="#E76F51" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="815" y="430" fill="#1D3557" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Data batch to Main every ~500 ms; no shared Local Variables between loops.</text>
</svg>