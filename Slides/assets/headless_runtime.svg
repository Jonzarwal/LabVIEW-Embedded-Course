<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Standalone embedded application after power-up</title>
  <desc id="desc">After power is applied, the MyRIO starts its real-time executable, samples and processes sensor data, logs selected events locally, and broadcasts measurements to an independent receiver without a host PC.</desc>
  <rect width="1600" height="440" rx="22" fill="#F3F7F6"/>
  <text x="70" y="66" fill="#1D3557" font-family="Arial, sans-serif" font-size="34" font-weight="700">Power on → application running, with no host PC</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="145" width="250" height="165" rx="16" fill="#FFFFFF" stroke="#E76F51" stroke-width="4"/>
    <text x="195" y="205" fill="#1D3557" font-size="28" font-weight="700">Power</text>
    <text x="195" y="252" fill="#354B55" font-size="21">cycle</text>

    <rect x="430" y="145" width="350" height="165" rx="16" fill="#FFFFFF" stroke="#457B9D" stroke-width="4"/>
    <text x="605" y="195" fill="#1D3557" font-size="27" font-weight="700">MyRIO boots</text>
    <text x="605" y="235" fill="#354B55" font-size="21">startup .rtexe</text>
    <text x="605" y="270" fill="#354B55" font-size="19">acquire + process</text>

    <rect x="930" y="95" width="280" height="125" rx="16" fill="#FFFFFF" stroke="#E9C46A" stroke-width="4"/>
    <text x="1070" y="145" fill="#1D3557" font-size="25" font-weight="700">Logbook</text>
    <text x="1070" y="182" fill="#354B55" font-size="19">selected events on target</text>

    <rect x="930" y="245" width="280" height="125" rx="16" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="4"/>
    <text x="1070" y="295" fill="#1D3557" font-size="25" font-weight="700">UDP broadcast</text>
    <text x="1070" y="332" fill="#354B55" font-size="19">live value + alarm</text>

    <rect x="1330" y="245" width="220" height="125" rx="16" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="4"/>
    <text x="1440" y="295" fill="#1D3557" font-size="25" font-weight="700">Receiver</text>
    <text x="1440" y="332" fill="#354B55" font-size="19">any host</text>
  </g>
  <g fill="none" stroke="#457B9D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 228h90m-18-18 18 18-18 18"/>
    <path d="M780 180h110m-18-18 18 18-18 18" stroke="#E9C46A"/>
    <path d="M780 265h110m-18-18 18 18-18 18" stroke="#2A9D8F"/>
    <path d="M1210 307h100m-18-18 18 18-18 18" stroke="#2A9D8F"/>
  </g>
  <text x="800" y="410" fill="#1D3557" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">The receiver is optional; local event logging remains on the target.</text>
</svg>